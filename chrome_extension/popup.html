<!-- chrome_extension/popup.html -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 350px;
            padding: 15px;
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #fff;
        }
        h2 {
            text-align: center;
            color: #00f5ff;
            margin-bottom: 15px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin: 5px 0;
            transition: all 0.3s;
        }
        .btn-start { background: #00ff88; color: #000; }
        .btn-stop { background: #ff4444; color: #fff; }
        .btn-dashboard { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn:hover { transform: scale(1.02); }
        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .status-active { background: rgba(0,255,136,0.2); }
        .status-inactive { background: rgba(255,255,255,0.05); }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h2>🎯 AI Meeting Analyzer</h2>

    <input type="text" id="candidate-name" placeholder="Candidate / Meeting Name">

    <div id="status" class="status status-inactive">
        Not Recording
    </div>

    <button class="btn btn-start" id="btn-start" onclick="startRecording()">
        ▶️ Start Recording & Monitoring
    </button>

    <button class="btn btn-stop" id="btn-stop" onclick="stopRecording()" style="display:none">
        ⏹️ Stop & Generate Report
    </button>

    <button class="btn btn-dashboard" onclick="openDashboard()">
        📊 Open Dashboard
    </button>

    <script src="popup.js"></script>
</body>
</html>
